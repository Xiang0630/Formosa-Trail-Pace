name: Formosa Trail Pages
on:
  push:
    branches: [main]
    paths: ['index.html', '.site-source/**', '.race-source/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formosa-trail-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified pages and apply mobile saving updates
        run: |
          python .site-source/build.py
          python .site-source/build-extra.py
          python .site-source/build-mobile-save.py
      - name: Commit generated website and guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md ft54.html ft40.html
          for file in ft75.html ft18.html USER_GUIDE_LINE.txt; do
            if [[ -f "$file" ]]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Publish device-tested mobile saving fixes for all four races"
            git push origin HEAD:main
          fi
      - name: Prepare public site only
        run: |
          mkdir -p _site
          for file in index.html ft75.html ft54.html ft40.html ft18.html USER_GUIDE_LINE.txt .nojekyll; do
            if [[ -f "$file" ]]; then cp "$file" _site/; fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
